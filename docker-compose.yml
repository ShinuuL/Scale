name: scale

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Porta do HOST configuravel. Dentro do container o backend sempre
      # escuta 4000 (ver environment abaixo). O .env usa 4100 para nao
      # colidir com um PostgreSQL local que costuma ocupar a 4000.
      - "${BACKEND_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      # Overrides do .env, que agora aponta para dev no host (PORT=4100,
      # DATABASE_URL relativo). Aqui o container fala pela rede interna:
      # escuta 4000 e usa o banco no volume nomeado.
      - PORT=4000
      - DATABASE_URL=file:/app/data/data.db
    volumes:
      - db_data:/app/data
    healthcheck:
      # Use 127.0.0.1 (not localhost): BusyBox wget can resolve localhost to
      # ::1 first, and IPv4-only listeners then refuse the connection (observed
      # on the frontend container).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - scale

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Injetados em BUILD time: o Next inlina NEXT_PUBLIC_* no bundle do
        # browser. Aqui a porta e a do HOST, que e o que o browser enxerga.
        NEXT_PUBLIC_BACKEND_PORT: ${BACKEND_PORT:-4000}
        NEXT_PUBLIC_BACKEND_URL: http://localhost:${BACKEND_PORT:-4000}
        NEXT_PUBLIC_WS_URL: http://localhost:${BACKEND_PORT:-4000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_BACKEND_PORT=${BACKEND_PORT:-4000}
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:${BACKEND_PORT:-4000}
      - NEXT_PUBLIC_WS_URL=http://localhost:${BACKEND_PORT:-4000}
      # Alvo SERVER-SIDE do proxy /api (rewrites do Next): DNS do servico na
      # rede interna. Nao pode ser localhost:<porta>, senao o container
      # apontaria para si mesmo.
      - BACKEND_URL=http://backend:4000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - scale

  coturn:
    image: coturn/coturn
    profiles:
      - turn
    ports:
      - "3478:3478/udp"
    networks:
      - scale

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    # Bind do HOST ao IP Tailscale (nunca 0.0.0.0): sem TAILSCALE_IP definido,
    # cai para 127.0.0.1 (localhost-only). O :443 interno do container segue
    # mapeado apenas para esta interface; o checkTailscaleOrigin do backend 403
    # fora da tailnet. Veja o comentario no Caddyfile.
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3443:443"
    environment:
      - TAILSCALE_IP=${TAILSCALE_IP:-127.0.0.1}
    volumes:
      - ./certs:/certs:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # Caddy admin API (localhost:2019) responde 200 com a config carregada.
      # Não depende do certificado, evitando false-negative se o cert expirar.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - scale

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    profiles:
      - mcp
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MCP_TOKEN=${MCP_TOKEN}
      - BACKEND_URL=http://backend:4000
      # JWT de usuario para o MCP autenticar em /api/metrics (obrigatorio para
      # /mcp/metrics; sem ele o endpoint responde 503 com a instrucao).
      - BACKEND_TOKEN=${BACKEND_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scale

volumes:
  db_data:
  caddy_data:

networks:
  scale:
