name: build

# Exemplo de CI para o desktop nativo (Rust/egui). Nao fica em .github/:
# copie para .github/workflows/build.yml se quiser rodar no GitHub Actions.
# Windows e gerado com cargo-xwin (cross a partir do Linux) ou rode um runner
# windows-latest com a metade windows/ deste arquivo.

on:
  push:
    paths: ["apps/desktop-native/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Dependencias de sistema (X11/Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev \
            libfreetype6-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-native
      - run: cargo build
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - name: Instaladores (deb + AppImage)
        run: |
          cargo install cargo-packager --locked
          cargo packager --release
      - uses: actions/upload-artifact@v4
        with:
          name: scale-desktop-linux
          path: apps/desktop-native/target/release/bundles/

  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo install cargo-xwin --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-native
      - name: Build (cross para Windows)
        run: cargo xwin build --release
        env:
          XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin
      - name: Instaladores (NSIS + MSI)
        run: cargo xwin packager --release
      - uses: actions/upload-artifact@v4
        with:
          name: scale-desktop-windows
          path: apps/desktop-native/target/x86_64-pc-windows-msvc/release/bundles/
