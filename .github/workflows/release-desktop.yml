# Instaladores do app desktop (Windows + Linux) publicados em GitHub Releases.
#
# Dispara em tags `v*` (ex.: `v0.2.0`). A versao da tag precisa bater com a de
# `apps/desktop/package.json` — o electron-updater compara justamente essa
# versao, e uma release com numero diferente deixa o app achando que ja esta
# atualizado. O job `versao` falha cedo quando divergem.
#
# A release sai como rascunho (`--publish always` + `releaseType: draft` do
# electron-builder): os dois jobs enviam artefatos para a MESMA release, e so
# quando ela e publicada manualmente no GitHub os apps instalados enxergam a
# atualizacao. Isso evita que o Windows receba o update antes do build Linux
# terminar.
#
# Artefatos (nomes fixos, usados pelos links da landing page):
#   Scale-Setup-x64.exe + latest.yml        (Windows, NSIS)
#   Scale-x64.AppImage  + latest-linux.yml  (Linux, auto-update)
#   Scale-x64.deb                           (Debian/Ubuntu, sem auto-update)
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag ja existente para (re)construir, ex.: v0.2.0
        required: true

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  versao:
    name: Conferir versao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag precisa bater com apps/desktop/package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "::error::Tag $TAG != versao $PKG em apps/desktop/package.json"
            exit 1
          fi
          echo "Versao $PKG confirmada."

  build:
    name: ${{ matrix.nome }}
    needs: versao
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows (NSIS)
            os: windows-latest
            alvo: --win nsis --x64
          - nome: Linux (AppImage + deb)
            os: ubuntu-latest
            alvo: --linux AppImage deb --x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint -w scale-desktop
      - run: npm run test -w scale-desktop
      - run: npm run build -w scale-desktop
      - name: Empacotar e publicar na release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder ${{ matrix.alvo }} --publish always
